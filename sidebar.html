<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; padding: 20px; font-size: 15px; line-height: 1.6; color: #333; background: #fafcff; }
    h2 { color: #333; margin: 0 0 8px; }
    .intro { margin: 0; color: #666; }
    .box { background: #eef6ff; padding: 18px; border-radius: 16px; margin-top: 18px; border: 1px solid #d7e8ff; box-shadow: 0 6px 18px rgba(61, 95, 160, 0.06); }
    .section + .section { margin-top: 16px; }
    .section-title { font-weight: 700; margin-bottom: 8px; color: #1f3b66; }
    .summary-card { background: rgba(255,255,255,0.86); border-radius: 12px; padding: 14px; border: 1px solid #dbe9ff; white-space: pre-wrap; }
    .source-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 12px; }
    .source-item-title { font-weight: 600; }
    .source-item-meta { color: #666; font-size: 13px; margin: 2px 0 4px; }
  </style>
</head>
<body>
  <h2>Context Companion</h2>
  <p class="intro">划选新闻关键词后，这里会显示 AI 背景总结和相关来源。</p>

  <div class="box" id="context-content">
    <div class="section">
      <div class="section-title">背景总结</div>
      <div class="summary-card" id="summary-text">这里将显示 AI 生成的背景总结...</div>
    </div>

    <div class="section">
      <div class="section-title">参考新闻来源</div>
      <div id="news-list">这里将显示 Top5 新闻来源...</div>
    </div>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
